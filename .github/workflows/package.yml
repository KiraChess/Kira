name: Package Kira

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'src/**'
      - 'Cargo.*'
      - 'tools/release/**'
      - '.github/workflows/package.yml'

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
            target: x86_64-pc-windows-msvc
          - os: macos-14
            platform: macos-arm64
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.platform == 'windows-x64' && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.98.1
        run: rustup toolchain install 1.98.1 --profile minimal --target ${{ matrix.target }}
      - name: Test UCI network startup
        run: cargo +1.98.1 test --locked --test uci_network_startup --target ${{ matrix.target }}
      - name: Build engine
        run: cargo +1.98.1 build --release --locked --bin kira1a --target ${{ matrix.target }}
      - name: Package and smoke test
        run: python tools/release/package.py --platform ${{ matrix.platform }} --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: kira-1-alpha-v1.0.1-${{ matrix.platform }}
          path: dist/release/*
          if-no-files-found: error
